name: Build and Promote

# Build once, on push to develop, then either deploy that exact artifact to
# staging (develop) or reuse it for prod (master) — no second npm
# install/vite build per environment. Relies on develop -> master merges
# staying fast-forward (see deployment.md): that's what keeps github.sha
# identical between the develop build and the later master push, which is
# how deploy-prod locates the right artifact to reuse instead of rebuilding.

on:
  push:
    branches: [develop, master]

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 90

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_PLANT_0A9DE771E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          output_location: ""
          skip_app_build: true

  deploy-prod:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Find the develop build for this exact commit
        id: findrun
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success" \
            --jq "[.workflow_runs[] | select(.name==\"Build and Promote\" and .id != ${{ github.run_id }})] | .[0].id")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful 'Build and Promote' run found for commit ${{ github.sha }}. This means master's HEAD isn't a commit that was already built+verified on develop (e.g. the merge wasn't a fast-forward, or the develop build hasn't finished/succeeded yet). Not rebuilding automatically — merge develop into master with a fast-forward merge after its build is green, then re-push."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          run-id: ${{ steps.findrun.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_DUNE_0837AD21E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          output_location: ""
          skip_app_build: true
