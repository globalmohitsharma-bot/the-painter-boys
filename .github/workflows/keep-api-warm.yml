# Pings the prod API's health endpoint every 10 minutes so the App Service
# instance never idles out (App Service unloads an idle app after ~20 min
# when Always On is off, e.g. on the Free F1 tier) — a cold start costs the
# next real user 10–30s. Also warms its Cosmos connection (see /api/health
# in backend/Program.cs). Scheduled workflows only run from the default
# branch (master), and GitHub disables them in a public repo after 60 days
# with no commits — re-enable from the Actions tab if that ever happens.
# Never fails the run on a missed ping (would just spam failure emails);
# the frontend's own wake-up logic (src/apiWake.js) covers any gap.
name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 https://thepainterboys-api.azurewebsites.net/api/health; then
              echo; echo "API is awake (attempt $attempt)"; exit 0
            fi
            sleep 10
          done
          echo "::warning::API did not answer its health check after 6 attempts"
