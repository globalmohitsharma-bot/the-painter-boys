<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d2137" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Google Identity Services — client-side "Sign in with Google" for the
         customer portal (BottomNav.jsx). Loading the script here is harmless
         with no client ID configured yet; the button itself won't work until
         VITE_GOOGLE_CLIENT_ID is set — see deployment.md. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PainterBoys" />
    <title>The Painter Boys</title>
    <!-- Static fallback for crawlers/link-previews that don't execute JS (per-page
         title/description/JSON-LD are set dynamically via react-helmet-async in
         Home.jsx/Blog.jsx/etc. for everything that does run JS, e.g. Google). -->
    <meta property="og:site_name" content="The Painter Boys" />
    <meta property="og:image" content="https://www.thepainterboys.com/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Painter Boys — Professional Home Painting Services" />
    <meta name="twitter:description" content="Interior, exterior, waterproofing & premium finishes across Ghaziabad, Noida & Delhi NCR. Trusted since 2010." />
    <meta name="twitter:image" content="https://www.thepainterboys.com/logo.png" />
    <style>
      /* Static (no-JS-required) splash shown the instant the HTML paints, so
         there's never a blank white flash while the app's JS parses/mounts —
         main.jsx fades and removes this once React has actually rendered. */
      #splash {
        position: fixed; inset: 0; z-index: 99999; background: #faf7f2;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .4s ease;
      }
      #splash img { width: min(280px, 60vw); height: auto; }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash"><img src="/logo.png" alt="The Painter Boys" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
